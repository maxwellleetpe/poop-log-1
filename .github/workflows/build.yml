name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Set NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          echo "✅ npm install done"

      - name: Verify expo CLI
        run: npx --no-install expo --version

      - name: Expo prebuild Android
        run: |
          npx expo prebuild --platform android --no-install
          echo "✅ prebuild done"
          ls -la android/

      - name: Build APK (arm64 only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            -x lint \
            -PreactNativeArchitectures=arm64-v8a

      - name: Show APK info
        if: always()
        run: find android/app/build/outputs -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "no APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: poop-log-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
