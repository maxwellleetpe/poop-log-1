name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Set NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --parallel -x lint -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/poop-log.apk
          ls -lh out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poop-log-APK
          path: out/poop-log.apk
          retention-days: 90

      - name: Create or update Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 大便日誌 (latest build)
          body: |
            自動 build 的 Android APK
            
            **下載**：點下方 `poop-log.apk`
            
            **安裝**：
            1. 傳到 Android 手機
            2. 設定 → 安全性 → 允許未知來源安裝
            3. 點 APK 安裝
          files: out/poop-log.apk
          make_latest: true
